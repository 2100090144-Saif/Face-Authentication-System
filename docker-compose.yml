version: "3.9"

# ============================================================
# Face Authentication System - Docker Compose
# ============================================================

services:

  # ── Main application ──────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: face_auth_app
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - FLASK_APP=run.py
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DATABASE_URL=sqlite:////app/instance/app.db
      - FACE_RECOGNITION_TOLERANCE=0.6
      - FACE_ENCODING_MODEL=large
      - PYTHONUNBUFFERED=1
      # Email Configuration (Gmail SMTP)
      - MAIL_SERVER=${MAIL_SERVER:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USE_TLS=${MAIL_USE_TLS:-True}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_DEFAULT_SENDER=${MAIL_DEFAULT_SENDER}

    volumes:
      # ── DEVELOPMENT MODE: Map entire project ──
      # This allows you to edit files locally and see changes immediately
      - .:/app
      
      # Exclude these directories (use container versions)
      - /app/__pycache__
      - /app/backend/__pycache__
      - /app/ai_service/__pycache__
      - /app/frontend/__pycache__
      
      # Persist database (important!)
      - ./instance:/app/instance
      
      # Persist logs | abc
      - ./logs:/app/logs


    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:5000/health"]
      # test: ["CMD", "curl", "-f", "-k", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - face_auth_network

networks:
  face_auth_network:
    driver: bridge
